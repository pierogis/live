<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<!-- A voting card: a plate, then a row of rating dots per rating. Edged like the KARL plate. -->
	<defs>
		<path id="shape" d="M24,14 L76,14 L76,86 L24,86 Z" />
		<clipPath id="lit"><polygon points="4,-6 96,-6 66.5,23.5 33.5,76.5 4,106" /></clipPath>
		<circle id="dot" r="3" />
		<circle id="empty" r="2.4" fill="none" stroke="rgb(58,96,106)" stroke-width="1.3" />
	</defs>
	<g fill="none" stroke-linejoin="round">
		<use href="#shape" stroke="rgb(225,140,150)" stroke-width="15" />
		<use href="#shape" stroke="rgb(140,205,225)" stroke-width="15" clip-path="url(#lit)" />
		<use href="#shape" stroke="rgb(255,203,210)" stroke-width="5" />
		<use href="#shape" stroke="rgb(202,243,255)" stroke-width="5" clip-path="url(#lit)" />
	</g>
	<use href="#shape" fill="rgb(255,240,220)" />
	<rect x="31" y="22" width="38" height="20" rx="3" fill="rgb(202,243,255)" stroke="rgb(58,96,106)" stroke-width="1.6" />
	<g fill="rgb(58,96,106)">
		<rect x="36" y="28" width="8" height="8" rx="1.5" />
		<rect x="46" y="28" width="8" height="8" rx="1.5" />
		<rect x="56" y="28" width="8" height="8" rx="1.5" />
		<use href="#dot" x="34" y="56" /><use href="#dot" x="42" y="56" /><use href="#dot" x="50" y="56" /><use href="#dot" x="58" y="56" /><use href="#empty" x="66" y="56" />
		<use href="#dot" x="34" y="66" /><use href="#dot" x="42" y="66" /><use href="#empty" x="50" y="66" /><use href="#empty" x="58" y="66" /><use href="#empty" x="66" y="66" />
		<use href="#dot" x="34" y="76" /><use href="#dot" x="42" y="76" /><use href="#dot" x="50" y="76" /><use href="#empty" x="58" y="76" /><use href="#empty" x="66" y="76" />
	</g>
</svg>
