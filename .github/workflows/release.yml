name: release

# Opens the Version Packages PR from the pending changesets, and publishes
# @pierogis/utensils to npm when that PR merges. The sites are ignored by
# changesets and deploy from deploy.yml.
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# The changesets action pushes the version commit and opens its pull request.
permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup toolchain and dependencies
        uses: ./.github/actions/toolchain

      - name: create release pull request or publish packages
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
